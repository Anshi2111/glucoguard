<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glucoguard AI | Login</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #0d1117;
    }
    .auth-card {
      background: #1a2332;
      border-radius: 15px;
      padding: 60px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 500px;
      border: 1px solid #2d3e54;
    }
    .auth-card .brand {
      display: flex;
      gap: 15px;
      align-items: center;
      justify-content: center;
      margin-bottom: 40px;
    }
    .auth-card .brand-mark {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      background: linear-gradient(135deg, #00d9ff, #0099cc);
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 30px;
      color: #0f1823;
    }
    .auth-card .brand h2 {
      font-size: 24px;
      margin: 0;
      color: #e1e8ed;
    }
    .auth-card .brand span {
      font-size: 10px;
      color: #7a8694;
      letter-spacing: 1.1px;
      display: block;
    }
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .auth-form label {
      font-size: 10px;
      font-weight: 800;
      color: #7a8694;
      display: block;
      margin-bottom: 6px;
    }
    .auth-form input {
      width: 100%;
      padding: 12px;
      border: 1px solid #2d3e54;
      border-radius: 8px;
      background: #151d2b;
      font-size: 12px;
      font-family: inherit;
      color: #e1e8ed;
    }
    .auth-form input::placeholder {
      color: #5a6673;
    }
    .auth-form input:focus {
      outline: none;
      border-color: #00d9ff;
      box-shadow: 0 0 0 2px rgba(0, 217, 255, 0.2);
    }
    .auth-form select {
      width: 100%;
      padding: 12px;
      border: 1px solid #2d3e54;
      border-radius: 8px;
      background: #151d2b;
      font-size: 12px;
      color: #e1e8ed;
    }
    .auth-form button {
      background: linear-gradient(135deg, #00d9ff, #0099cc);
      color: #0f1823;
      border: 0;
      border-radius: 9px;
      padding: 13px 16px;
      font-size: 11px;
      font-weight: 850;
      cursor: pointer;
      margin-top: 10px;
    }
    .auth-form button:hover {
      opacity: 0.9;
    }
    .auth-toggle {
      text-align: center;
      font-size: 10px;
      color: #7a8694;
      margin-top: 25px;
    }
    .auth-toggle a {
      color: #00d9ff;
      text-decoration: none;
      cursor: pointer;
      font-weight: 800;
    }
    .auth-toggle a:hover {
      text-decoration: underline;
    }
    .error-msg {
      color: #ff4757;
      font-size: 10px;
      display: none;
    }
    .toast {
      position: fixed;
      right: 30px;
      bottom: 25px;
      background: #1a2332;
      color: #00d9ff;
      border: 1px solid #00d9ff;
      border-radius: 9px;
      padding: 12px 16px;
      font-size: 10px;
      display: none;
      z-index: 50;
      box-shadow: 0 10px 30px rgba(0, 217, 255, 0.1);
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="brand">
        <div class="brand-mark">G</div>
        <div>
          <h2>Glucoguard</h2>
          <span>AI CONNECTED CARE</span>
        </div>
      </div>

      <form class="auth-form" id="auth-form">
        <div style="display: none;" id="register-fields">
          <label>First Name</label>
          <input type="text" id="firstName" placeholder="John">
          <label>Last Name</label>
          <input type="text" id="lastName" placeholder="Doe">
          <label>Diabetes Type</label>
          <select id="diabetesType" style="width:100%; padding:9px; border:1px solid #e3eaf0; border-radius:8px; background:#fff; font-size:9px;">
            <option value="Type 1">Type 1 Diabetes</option>
            <option value="Type 2">Type 2 Diabetes</option>
            <option value="Gestational">Gestational Diabetes</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>

        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required>

        <div class="error-msg" id="error-msg"></div>

        <button type="submit" id="auth-btn">Login</button>

        <div class="auth-toggle">
          Don't have an account? <a onclick="toggleMode()">Sign up</a>
          <div style="display: none;" id="toggle-text">Already have an account? <a onclick="toggleMode()">Login</a></div>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const API_URL = 'http://localhost:5000/api';
    let isRegisterMode = false;

    function toggleMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('register-fields').style.display = isRegisterMode ? 'block' : 'none';
      document.getElementById('auth-btn').textContent = isRegisterMode ? 'Create Account' : 'Login';
      document.getElementById('toggle-text').style.display = isRegisterMode ? 'none' : 'block';
      document.getElementById('error-msg').textContent = '';
      document.getElementById('error-msg').style.display = 'none';
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => t.style.display = 'none', 2200);
    }

    function showError(msg) {
      const err = document.getElementById('error-msg');
      err.textContent = msg;
      err.style.display = 'block';
    }

    document.getElementById('auth-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showError('Email and password are required');
        return;
      }

      try {
        let endpoint = '/auth/login';
        let body = { email, password };

        if (isRegisterMode) {
          endpoint = '/auth/register';
          const firstName = document.getElementById('firstName').value;
          const lastName = document.getElementById('lastName').value;
          const diabetesType = document.getElementById('diabetesType').value;

          if (!firstName || !lastName) {
            showError('First name and last name are required');
            return;
          }

          body = { email, password, firstName, lastName, diabetesType };
        }

        const response = await fetch(`${API_URL}${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        const data = await response.json();

        if (!response.ok) {
          showError(data.error || 'Authentication failed');
          return;
        }

        localStorage.setItem('authToken', data.token);
        showToast(isRegisterMode ? 'Account created! Redirecting...' : 'Login successful! Redirecting...');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1000);
      } catch (err) {
        showError(err.message || 'Connection error');
      }
    });

    // Check if already logged in
    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('authToken')) {
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
